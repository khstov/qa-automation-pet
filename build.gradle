plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'io.rest-assured:rest-assured:5.5.7'

    testImplementation 'io.qameta.allure:allure-selenide:2.35.5'
    testImplementation 'com.codeborne:selenide:7.18.0'

    testImplementation 'io.qameta.allure:allure-rest-assured:2.35.5'

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'

    testImplementation 'org.wiremock:wiremock:3.13.2'
}

test {
    useJUnitPlatform()
}

tasks.register('smokeTest', Test) {
    group = 'verification'
    description = 'Runs smoke tests.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'smoke'
    }
}

tasks.register('regressionTest', Test) {
    group = 'verification'
    description = 'Runs regression tests.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'regression'
    }
}